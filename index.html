<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetra 3D Advanced - سیستم پیشرفته پردازش سه‌بعدی</title>
    <meta name="description" content="Advanced 3D Mesh Processing with Discrete Mathematics Algorithms">
    <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <nav class="nav">
                <div class="nav-brand">
                    <h1>🧠 Tetra 3D Advanced</h1>
                </div>
                <div class="nav-links">
                    <a href="#home" class="nav-link">خانه</a>
                    <a href="#converter" class="nav-link">تبدیل 2D به 3D</a>
                    <a href="#reducer" class="nav-link">کاهش پیچیدگی</a>
                    <a href="#about" class="nav-link">درباره</a>
                </div>
            </nav>
        </header>

        <main>
            <!-- صفحه اصلی -->
            <section id="home" class="hero">
                <div class="hero-content">
                    <h2>سیستم پیشرفته پردازش مدل‌های سه‌بعدی</h2>
                    <p>با الگوریتم‌های مبتنی بر ریاضیات گسسته و سیستم‌های پیشامد</p>
                    <div class="hero-buttons">
                        <a href="#converter" class="btn btn-primary">🎨 تبدیل 2D به 3D</a>
                        <a href="#reducer" class="btn btn-secondary">📐 کاهش پیچیدگی</a>
                    </div>
                </div>
            </section>

            <!-- مبدل 2D به 3D -->
            <section id="converter" class="section">
                <div class="container">
                    <h3>تبدیل پیشرفته 2D به 3D</h3>
                    <div id="converter-app"></div>
                </div>
            </section>

            <!-- کاهش دهنده پیچیدگی -->
            <section id="reducer" class="section">
                <div class="container">
                    <h3>کاهش پیچیدگی با کره گسسته</h3>
                    <div id="reducer-app"></div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="container">
                <p>ساخته شده با ❤️ توسط تیم تترا</p>
            </div>
        </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
